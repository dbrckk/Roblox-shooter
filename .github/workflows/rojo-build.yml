name: Rojo build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rojo 7.7.1
        run: |
          curl --fail --location --output rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -q rojo.zip
          chmod +x rojo

      - name: Install official Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output luau-ubuntu.zip \
            https://github.com/luau-lang/luau/releases/download/0.744/luau-ubuntu.zip
          unzip -q luau-ubuntu.zip
          chmod +x ./luau-compile
          ./luau-compile --help > /dev/null || true

      - name: Parse and compile every Luau source
        shell: bash
        run: |
          set -euo pipefail
          find src tools/studio -type f \( -name '*.luau' -o -name '*.lua' \) -print0 | \
            xargs -0 -r -n 1 ./luau-compile > /dev/null
          echo "All gameplay and Studio installer Lua sources compiled successfully."

      - name: Parse private Roblox publish script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/publish_private_roblox.py
          python3 scripts/publish_private_roblox.py --help > /dev/null

      - name: Check private Roblox account publication prerequisites without exposing secrets
        shell: bash
        env:
          ROBLOX_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          IRON_YARD_UNIVERSE_ID: ${{ vars.IRON_YARD_UNIVERSE_ID }}
          IRON_YARD_PLACE_ID: ${{ vars.IRON_YARD_PLACE_ID }}
        run: |
          set -euo pipefail
          echo '### Roblox publication access check (readiness only)' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$ROBLOX_KEY" ]; then
            echo '- Open Cloud authorization: **NOT CONFIGURED**' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Open Cloud authorization: NOT CONFIGURED"
          else
            echo '- Open Cloud authorization: **configured** (secret value not exposed)' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Open Cloud authorization: CONFIGURED"
          fi
          if [ -z "$IRON_YARD_UNIVERSE_ID" ]; then
            echo '- IRON YARD universe destination: **NOT CONFIGURED**' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::IRON YARD universe destination: NOT CONFIGURED"
          else
            echo '- IRON YARD universe destination: configured' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::IRON YARD universe destination: CONFIGURED"
          fi
          if [ -z "$IRON_YARD_PLACE_ID" ]; then
            echo '- IRON YARD starting place: **NOT CONFIGURED**' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::IRON YARD starting place: NOT CONFIGURED"
          else
            echo '- IRON YARD starting place: configured' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::IRON YARD starting place: CONFIGURED"
          fi
          echo '- No request to Roblox was sent by this diagnostic.' >> "$GITHUB_STEP_SUMMARY"

      - name: Parse asset production Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/assetforge/*.py
          echo "All asset production Python modules are syntactically valid."

      - name: Verify visual identity and PBR palette consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_visual_identity.py


      - name: Verify weapon, reload and input wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_weapon_contract.py

      - name: Verify persistent DataStore progression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_progression_contract.py

      - name: Build place
        run: ./rojo build default.project.json -o iron-yard.rbxlx

      - name: Upload playable Roblox Studio place
        uses: actions/upload-artifact@v4
        with:
          name: iron-yard-roblox-place
          path: iron-yard.rbxlx
          if-no-files-found: error
          retention-days: 14
