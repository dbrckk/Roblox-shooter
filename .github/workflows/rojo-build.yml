name: Rojo build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rojo 7.7.1
        run: |
          curl --fail --location --output rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -q rojo.zip
          chmod +x rojo

      - name: Build place
        run: ./rojo build default.project.json -o neon-strike.rbxlx

      - name: Upload playable Roblox Studio place
        uses: actions/upload-artifact@v4
        with:
          name: neon-strike-roblox-place
          path: neon-strike.rbxlx
          if-no-files-found: error
          retention-days: 14
