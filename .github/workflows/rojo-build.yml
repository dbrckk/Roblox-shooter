name: Rojo build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rojo 7.7.1
        run: |
          curl --fail --location --output rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -q rojo.zip
          chmod +x rojo

      - name: Install official Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output luau-ubuntu.zip \
            https://github.com/luau-lang/luau/releases/download/0.744/luau-ubuntu.zip
          unzip -q luau-ubuntu.zip
          chmod +x ./luau-compile ./luau
          ./luau-compile --help > /dev/null || true

      - name: Parse and compile every Luau source
        shell: bash
        run: |
          set -euo pipefail
          find src tools/studio -type f \( -name '*.luau' -o -name '*.lua' \) -print0 | \
            xargs -0 -r -n 1 ./luau-compile > /dev/null
          echo "All gameplay and Studio installer Lua sources compiled successfully."

      - name: Run executable Luau progression ledger regression suites
        shell: bash
        run: |
          set -euo pipefail
          ./luau scripts/test_progression_ledger.luau
          ./luau scripts/test_operator_finishes.luau
          ./luau scripts/test_touch_layout.luau
          ./luau scripts/test_gantry_motion.luau
          ./luau scripts/test_bot_avoidance.luau
          ./luau scripts/test_bot_path_budget.luau
          ./luau scripts/test_bot_perf_profile.luau
          ./luau scripts/test_bot_movement_progress.luau
          ./luau scripts/test_bot_combat_response.luau
          ./luau scripts/test_bot_cover_plan.luau
          ./luau scripts/test_bot_engagement_plan.luau
          ./luau scripts/test_bot_target_selection.luau
          ./luau scripts/test_bot_hearing_plan.luau
          ./luau scripts/test_bot_sound_search.luau
          ./luau scripts/test_bot_medical_objective.luau
          ./luau scripts/test_bot_motion_profile.luau
          ./luau scripts/test_bot_death_plan.luau
          ./luau scripts/test_combat_vfx_profile.luau
          ./luau scripts/test_environment_profile.luau
          ./luau scripts/test_art_lod_policy.luau
          ./luau scripts/test_yard_wayfinding_plan.luau
          ./luau scripts/test_warehouse_cladding_plan.luau
          ./luau scripts/test_freight_surface_plan.luau
          ./luau scripts/test_pallet_visual_plan.luau
          ./luau scripts/test_catwalk_deck_plan.luau
          ./luau scripts/test_forklift_visual_plan.luau
          ./luau scripts/test_cover_surface_plan.luau
          ./luau scripts/test_vanguard_mesh_policy.luau
          ./luau scripts/test_round_standings.luau
          ./luau scripts/test_weapon_cadence.luau
          ./luau scripts/test_safe_planar_input.luau
          ./luau scripts/test_spawn_safety.luau
          ./luau scripts/test_supply_rules.luau

      - name: Parse private Roblox publish script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/publish_private_roblox.py
          python3 scripts/publish_private_roblox.py --help > /dev/null

      - name: Check private Roblox account publication prerequisites without exposing secrets
        shell: bash
        env:
          ROBLOX_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          IRON_YARD_UNIVERSE_ID: ${{ vars.IRON_YARD_UNIVERSE_ID }}
          IRON_YARD_PLACE_ID: ${{ vars.IRON_YARD_PLACE_ID }}
        run: |
          set -euo pipefail
          echo '### Roblox publication access check (readiness only)' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$ROBLOX_KEY" ]; then
            echo '- Open Cloud authorization: **NOT CONFIGURED**' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Open Cloud authorization: NOT CONFIGURED"
          else
            echo '- Open Cloud authorization: **configured** (secret value not exposed)' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Open Cloud authorization: CONFIGURED"
          fi
          if [ -z "$IRON_YARD_UNIVERSE_ID" ]; then
            echo '- IRON YARD universe destination: **NOT CONFIGURED**' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::IRON YARD universe destination: NOT CONFIGURED"
          else
            echo '- IRON YARD universe destination: configured' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::IRON YARD universe destination: CONFIGURED"
          fi
          if [ -z "$IRON_YARD_PLACE_ID" ]; then
            echo '- IRON YARD starting place: **NOT CONFIGURED**' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::IRON YARD starting place: NOT CONFIGURED"
          else
            echo '- IRON YARD starting place: configured' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::IRON YARD starting place: CONFIGURED"
          fi
          echo '- No request to Roblox was sent by this diagnostic.' >> "$GITHUB_STEP_SUMMARY"

      - name: Parse asset production and optional Roblox upload Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/assetforge/*.py scripts/upload_vanguard_models.py scripts/upload_world_pbr_images.py
          python3 scripts/upload_vanguard_models.py --help > /dev/null
          python3 scripts/upload_world_pbr_images.py --help > /dev/null
          python3 scripts/test_vanguard_upload_contract.py
          python3 scripts/test_audit_vanguard_glb.py
          python3 scripts/test_world_pbr_pipeline.py
          echo "Model + world PBR map generation, integrity, upload security tests passed."

      - name: Verify visual identity and PBR palette consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_visual_identity.py


      - name: Verify weapon, reload and input wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_weapon_contract.py

      - name: Verify server movement remote validation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_movement_contract.py
          python3 scripts/check_bot_navigation_budget.py
          python3 scripts/check_bot_los_budget.py
          python3 scripts/check_bot_perf_contract.py

      - name: Verify persistent DataStore progression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_progression_contract.py

      - name: Build place
        run: ./rojo build default.project.json -o iron-yard.rbxlx

      - name: Upload playable Roblox Studio place
        uses: actions/upload-artifact@v4
        with:
          name: iron-yard-roblox-place
          path: iron-yard.rbxlx
          if-no-files-found: error
          retention-days: 14
