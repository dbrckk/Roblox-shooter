name: Rojo build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rojo 7.7.1
        run: |
          curl --fail --location --output rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -q rojo.zip
          chmod +x rojo

      - name: Install official Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output luau-ubuntu.zip \
            https://github.com/luau-lang/luau/releases/download/0.744/luau-ubuntu.zip
          unzip -q luau-ubuntu.zip
          chmod +x ./luau-compile
          ./luau-compile --help > /dev/null || true

      - name: Parse and compile every Luau source
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.luau' -print0 | \
            xargs -0 -r -n 1 ./luau-compile > /dev/null
          echo "All Luau sources compiled successfully."

      - name: Build place
        run: ./rojo build default.project.json -o neon-strike.rbxlx

      - name: Upload playable Roblox Studio place
        uses: actions/upload-artifact@v4
        with:
          name: neon-strike-roblox-place
          path: neon-strike.rbxlx
          if-no-files-found: error
          retention-days: 14
