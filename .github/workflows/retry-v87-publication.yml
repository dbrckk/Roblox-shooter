name: Probe the IRON YARD publication queue

on:
  push:
    branches: [ops/retry-v87-publication]

permissions:
  actions: write
  contents: read

# Use the production queue without cancelling any active publication.
concurrency:
  group: iron-yard-public-release
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'dbrckk/Roblox-shooter'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Dispatch again only after confirmed cancellation before any job began
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 4033b06ec4019040ecbe7d60201953678e91fec7
          STALLED_RUN: '43874520197'
          PUBLISH_WORKFLOW: publish-roblox-public.yml
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          endpoint="$repo/actions/runs/$STALLED_RUN"
          run="$(gh api "$endpoint")"
          if ! jq -e --arg sha "$RELEASE_SHA" \
            '.head_branch == "main" and .head_sha == $sha and .status == "completed" and .conclusion == "cancelled"' \
            <<< "$run"; then
            echo "No dispatch: the original run has not been confirmed cancelled."
            exit 0
          fi
          gh api "$endpoint/jobs?filter=all" | jq -e '.total_count == 0'
          test "$(gh api "$repo/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
          no_other_release="$(gh api -X GET "$repo/actions/workflows/$PUBLISH_WORKFLOW/runs" \
            -f head_sha="$RELEASE_SHA" -f branch=main -f per_page=100 \
            --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length')"
          test "$no_other_release" = 0
          gh workflow run "$PUBLISH_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main \
            --field check_only=false --field confirmation="PUBLISH IRON YARD PUBLIC"
          echo "The cancelled run never had a job. Redispatched v87 at $RELEASE_SHA."
