name: Clear the stalled IRON YARD v87 run

on:
  push:
    branches: [ops/retry-v87-publication]

permissions:
  actions: read

# Only this branch and repository run the cancellation probe. It cannot publish.
concurrency:
  group: iron-yard-public-release
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'dbrckk/Roblox-shooter'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report the original release and its jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/43874520197"
          gh api "$endpoint" --jq '{id, head_sha, status, conclusion}'
          gh api "$endpoint/jobs?filter=all" --jq '{total_count, jobs: [.jobs[] | {id, name, status, conclusion}]}'
