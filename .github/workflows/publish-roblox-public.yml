name: Publish IRON YARD to PUBLIC Roblox experience

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Verify target access and PUBLIC visibility; no upload (recommended first)'
        type: boolean
        required: true
        default: true
      confirmation:
        description: 'For a live update type exactly PUBLISH IRON YARD PUBLIC'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: iron-yard-public-release
  cancel-in-progress: false

jobs:
  public-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source at workflow SHA
        uses: actions/checkout@v4

      - name: Require deliberate public release confirmation
        if: ${{ !inputs.check_only }}
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "PUBLISH IRON YARD PUBLIC" || {
            echo "::error::Explicit PUBLIC release confirmation is required."; exit 1;
          }

      - name: Verify release safeguards without connecting to Roblox
        run: |
          python3 scripts/test_public_release.py
          python3 scripts/test_publish_public_roblox.py

      - name: Resolve and independently verify the exact PUBLIC owner destination
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          CONFIGURED_UNIVERSE_ID: ${{ vars.IRON_YARD_UNIVERSE_ID || secrets.IRON_YARD_UNIVERSE_ID }}
          CONFIGURED_PLACE_ID: ${{ vars.IRON_YARD_PLACE_ID || secrets.IRON_YARD_PLACE_ID }}
        run: |
          python3 scripts/resolve_public_target.py --github-env "$GITHUB_ENV"

      - name: Verify existing PUBLIC universe and the intended creator
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python3 scripts/publish_public_roblox.py --universe-id "$IRON_YARD_UNIVERSE_ID" --place-id "$IRON_YARD_PLACE_ID" --source-commit "$GITHUB_SHA" --dry-run

      - name: Require successful CI for exact source commit
        if: ${{ !inputs.check_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/rojo-build.yml/runs" -f head_sha="$GITHUB_SHA" -f per_page=20 > ci.json
          jq -e --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "push")] | length > 0' ci.json || {
            echo "::error::Exact commit has not passed the Rojo build push workflow."; exit 1;
          }

      - name: Install official Luau and Rojo
        if: ${{ !inputs.check_only }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output luau-ubuntu.zip https://github.com/luau-lang/luau/releases/download/0.744/luau-ubuntu.zip
          unzip -q luau-ubuntu.zip
          chmod +x ./luau-compile
          curl --fail --location --retry 3 --output rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -q rojo.zip
          chmod +x ./rojo

      - name: Stamp source, compile and build released place
        if: ${{ !inputs.check_only }}
        run: |
          set -euo pipefail
          python3 scripts/stamp_build.py --sha "$GITHUB_SHA"
          find src tools/studio -type f \( -name '*.luau' -o -name '*.lua' \) -print0 | xargs -0 -r -n 1 ./luau-compile > /dev/null
          ./rojo build default.project.json -o iron-yard.rbxlx

      - name: Publish explicitly authorized PUBLIC release
        if: ${{ !inputs.check_only }}
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python3 scripts/publish_public_roblox.py --universe-id "$IRON_YARD_UNIVERSE_ID" --place-id "$IRON_YARD_PLACE_ID" --source-commit "$GITHUB_SHA" --place-file iron-yard.rbxlx --confirm-public
