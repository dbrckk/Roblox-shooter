name: Dispatch authorized original weapon assets upload

on:
  push:
    branches: [main]
    paths:
      - .github/authorized-weapon-upload-request.txt

permissions:
  actions: write
  contents: read

concurrency:
  group: iron-yard-upload-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'dbrckk/Roblox-shooter'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start the existing owner-verified Open Cloud asset workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run upload-weapon-opencloud.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            --field creator_user_id=9774173158 \
            --field publish_assets=true
          echo "Dispatched the authorized ten-model Open Cloud upload workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "Follow results in Actions > Upload original weapon PBR GLBs to Roblox." >> "$GITHUB_STEP_SUMMARY"
