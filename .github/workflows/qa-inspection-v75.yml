name: IRON YARD v75 inspection station engine QA
on:
  push:
    branches: [qa/inspection-v75-engine]
permissions:
  contents: read
jobs:
  exact-place-test:
    if: github.repository == 'dbrckk/Roblox-shooter'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Exercise inspection station in Roblox engine (public place version 71)
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python3 tools/qa/run_inspection_station_v75.py
