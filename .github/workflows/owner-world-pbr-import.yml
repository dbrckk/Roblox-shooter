name: Authorize exactly one original world PBR Image import

on:
  push:
    branches: [main]
    paths:
      - ".github/authorized-world-pbr-v1.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: iron-yard-one-time-world-pbr-import
  cancel-in-progress: false

jobs:
  upload-owner-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Read owner-approved marker and original importer
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify strict source, owner and CI preflight
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/launch_world_pbr_import.sh
          python3 scripts/test_world_pbr_import_gate.py
          python3 scripts/test_asset_activation_pipeline.py
          python3 scripts/asset_acceptance_matrix.py

      - name: Import only approved owner Images and verify new registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROBLOX_ASSETS_KEY_AVAILABLE: ${{ secrets.ROBLOX_OPEN_CLOUD_ASSETS_KEY != '' }}
        run: bash scripts/launch_world_pbr_import.sh
