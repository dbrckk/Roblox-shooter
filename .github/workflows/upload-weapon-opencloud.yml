name: Upload original weapon PBR GLBs to Roblox (owner-authorized)

on:
  workflow_dispatch:
    inputs:
      asset_run_id:
        description: "Successful weaponforge run ID; blank uses latest successful main run"
        required: false
        type: string
        default: ""
      creator_user_id:
        description: "Confirmed owner Roblox User ID"
        required: true
        type: string
        default: "9774173158"
      publish_assets:
        description: "Actually create ten Roblox Model assets and update their IDs"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: iron-yard-original-weapon-owner-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Check asset owner and required credentials before downloading artifacts
        shell: bash
        env:
          CREATOR: ${{ inputs.creator_user_id }}
          ACTIVATE: ${{ inputs.publish_assets }}
          ASSET_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_ASSETS_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          registry = Path("src/shared/WeaponAssetIds.luau").read_text("utf-8")
          declared = re.search(r"\\bownerUserId\\s*=\\s*(\\d+)\\b", registry)
          if not declared or declared.group(1) != os.environ["CREATOR"]:
              raise SystemExit("Configured Roblox owner differs from committed owner registry")
          print("Verified Roblox model owner (not uploading yet).")
          PY
          if [[ "$ACTIVATE" == "true" ]]; then
            if [[ -z "$ASSET_KEY" ]]; then
              echo "::error::Configure GitHub secret ROBLOX_OPEN_CLOUD_ASSETS_KEY before selecting publish_assets=true"
              exit 1
            fi
            echo "Asset key present; owner-authorized uploads may proceed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Safe dry-run selected: no Roblox assets will be created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Locate a validated forge run (same authored weapon source)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.asset_run_id }}
        run: |
          set -euo pipefail
          run_id="$REQUESTED_RUN"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh run list --workflow weaponforge.yml --branch main --limit 20 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success")][0].databaseId')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "No successful weaponforge run"; exit 1; }
          [[ "$(gh run view "$run_id" --json conclusion --jq '.conclusion')" == "success" ]] || {
            echo "Forge source run was not successful"; exit 1;
          }
          source_sha="$(gh run view "$run_id" --json headSha --jq '.headSha')"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git fetch --quiet origin "$source_sha" --depth=100
          if ! git diff --quiet "$source_sha" HEAD -- \
              tools/weaponforge tools/assetforge/generate_maps.py \
              .github/workflows/weaponforge.yml; then
            echo "::error::Forge source no longer matches checked-out weapon source"
            exit 1
          fi
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          mkdir -p build/weapon-upload/source
          gh run download "$run_id" --name iron-yard-original-weapon-meshes \
            --dir build/weapon-upload/source
          test -f build/weapon-upload/source/manifest.json
          echo "Source forge run: $run_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate all ten GLB binary assets and upload safety
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/upload_weapon_models.py
          python3 scripts/test_weapon_upload_contract.py
          python3 tools/weaponforge/validate_weapon_exports.py \
            build/weapon-upload/source

      - name: Restore prior partial upload checkpoint if available
        if: ${{ inputs.publish_assets }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Previous runs can include dry-runs with no checkpoint. Search
          # for an actual recoverable artifact rather than guessing the last
          # execution. The Python importer revalidates the owner, source SHA,
          # content hash and live asset ownership before using any checkpoint.
          for prior in $(gh run list --workflow upload-weapon-opencloud.yml \
            --branch main --limit 20 --json databaseId --jq '.[].databaseId'); do
            if [[ "$prior" == "$GITHUB_RUN_ID" ]]; then continue; fi
            if gh run download "$prior" --name weapon-upload-checkpoint \
              --dir build/weapon-upload >/dev/null 2>&1; then
              echo "Recovered checkpoint from run $prior" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done

      - name: Verify source files offline or upload owner-approved models
        shell: bash
        env:
          CREATOR: ${{ inputs.creator_user_id }}
          ACTIVATE: ${{ inputs.publish_assets }}
          ROBLOX_OPEN_CLOUD_ASSETS_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_ASSETS_KEY }}
        run: |
          set -euo pipefail
          args=(--assets build/weapon-upload/source
            --owner-user-id "$CREATOR"
            --source-commit "$SOURCE_SHA"
            --checkpoint build/weapon-upload/checkpoint.json
            --module src/shared/WeaponAssetIds.luau)
          if [[ "$ACTIVATE" == "true" ]]; then
            args+=(--publish)
          else
            echo "Safe offline validation: no Roblox assets created." >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/upload_weapon_models.py "${args[@]}"

      - name: Store resumable upload record without secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weapon-upload-checkpoint
          path: build/weapon-upload/checkpoint.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit fully validated owner-owned asset registry
        if: ${{ inputs.publish_assets }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/WeaponAssetIds.luau
          if git diff --cached --quiet; then
            echo "No new verified Roblox asset IDs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "assets(weapon): register ten owner-verified PBR models"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "All ten uploaded model IDs committed; live servers will load verified meshes." \
            >> "$GITHUB_STEP_SUMMARY"
